<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Confirm your Quick Key email</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #101010;
    "
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f5f5f5">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="max-width: 520px; background-color: #ffffff; border: 1px solid #e8e8e8"
          >
            <tr>
              <td style="padding: 32px 32px 24px; text-align: center; border-bottom: 3px solid #e8282e">
                <a href="https://quickkey-eight.vercel.app" style="text-decoration: none; color: inherit">
                  <p
                    style="
                      margin: 0;
                      font-size: 34px;
                      font-weight: 800;
                      line-height: 1;
                      letter-spacing: 0.04em;
                      text-transform: uppercase;
                      color: #101010;
                    "
                  >
                    Quick <span style="color: #e8282e">Key</span>
                  </p>
                  <p
                    style="
                      margin: 6px 0 0;
                      font-size: 13px;
                      font-weight: 700;
                      letter-spacing: 0.24em;
                      text-transform: uppercase;
                      color: #101010;
                    "
                  >
                    Rental
                  </p>
                </a>
              </td>
            </tr>

            <tr>
              <td style="padding: 32px">
                <p style="margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #e8282e">
                  Confirm email change
                </p>
                <h1 style="margin: 0 0 16px; font-size: 22px; line-height: 1.25; font-weight: 700; text-transform: uppercase; color: #101010">
                  Verify your new address
                </h1>
                <p style="margin: 0 0 28px; font-size: 15px; line-height: 1.6; color: #333333">
                  Tap below to confirm <strong style="color: #101010">{{ .Email }}</strong> for your Quick Key account.
                </p>

                <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin: 0 auto 24px">
                  <tr>
                    <td align="center" style="border-radius: 4px; background-color: #e8282e">
                      <a
                        href="{{ .ConfirmationURL }}"
                        style="
                          display: inline-block;
                          padding: 14px 28px;
                          font-size: 12px;
                          font-weight: 700;
                          letter-spacing: 0.1em;
                          text-transform: uppercase;
                          text-decoration: none;
                          color: #ffffff;
                          background-color: #e8282e;
                        "
                      >
                        Confirm email
                      </a>
                    </td>
                  </tr>
                </table>

                <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #888888">
                  If you did not request this change, ignore this email.
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding: 20px 32px 28px; border-top: 1px solid #eeeeee; text-align: center; background-color: #101010">
                <p style="margin: 0; font-size: 12px; color: #aaaaaa">
                  Quick Key Rental ·
                  <a href="mailto:info@quickkeyrentalcar.com" style="color: #e8282e; text-decoration: none">info@quickkeyrentalcar.com</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
